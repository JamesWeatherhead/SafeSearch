name: Render v1 demo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/render-v1-demo.yml'

permissions:
  contents: write

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render web-friendly demo assets
        run: |
          ffmpeg -y -i docs/assets/safesearch-prototype-v1.mov \
            -vf "scale='min(1280,iw)':-2" \
            -c:v libx264 -preset medium -crf 30 -pix_fmt yuv420p \
            -c:a aac -b:a 96k -movflags +faststart \
            docs/assets/safesearch-prototype-v1.mp4

          ffmpeg -y -i docs/assets/safesearch-prototype-v1.mov \
            -vf "fps=6,scale=720:-1:flags=lanczos,split[s0][s1];[s0]palettegen=max_colors=128[p];[s1][p]paletteuse=dither=bayer:bayer_scale=5" \
            -t 15 \
            docs/assets/safesearch-prototype-v1-preview.gif

      - name: Update README demo section
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('README.md')
          text = p.read_text()

          start = text.index('## v1 prototype')
          end = text.index('\n## Repository layout', start)

          replacement = '''## v1 prototype

Before axis decomposition, v1 vectorized whole queries against a single embedding index. It had no principled way to separate clinical concepts from surrounding identifying context.

[![SafeSearch v1 prototype demo](docs/assets/safesearch-prototype-v1-preview.gif)](docs/assets/safesearch-prototype-v1.mp4)

**[Open the full v1 prototype video](docs/assets/safesearch-prototype-v1.mp4)**
'''

          p.write_text(text[:start] + replacement + text[end:])
          PY

      - name: Commit rendered assets
        run: |
          rm .github/workflows/render-v1-demo.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/assets/safesearch-prototype-v1.mp4 docs/assets/safesearch-prototype-v1-preview.gif .github/workflows/render-v1-demo.yml
          git commit -m "Render v1 prototype demo"
          git push
