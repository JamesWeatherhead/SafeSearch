<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">SafeSearch v1 prototype demo</title>
  <desc id="desc">Clickable preview card for the SafeSearch v1 prototype video.</desc>
  <rect width="1200" height="675" rx="28" fill="#0d1117"/>
  <rect x="1" y="1" width="1198" height="673" rx="27" fill="none" stroke="#30363d" stroke-width="2"/>
  <text x="72" y="98" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="54" font-weight="700">SafeSearch v1 prototype</text>
  <text x="72" y="148" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="25">Whole-query vector retrieval before axis decomposition</text>

  <g transform="translate(72 245)">
    <rect width="250" height="120" rx="18" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="125" y="52" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="24" font-weight="600">Clinical query</text>
    <text x="125" y="84" text-anchor="middle" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="18">PHI + clinical context</text>
  </g>

  <path d="M342 305 H445" stroke="#8b949e" stroke-width="5" stroke-linecap="round"/>
  <path d="M430 289 L451 305 L430 321" fill="none" stroke="#8b949e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(470 245)">
    <rect width="260" height="120" rx="18" fill="#161b22" stroke="#a371f7" stroke-width="2"/>
    <text x="130" y="52" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="24" font-weight="600">Single embedding</text>
    <text x="130" y="84" text-anchor="middle" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="18">whole-query vector</text>
  </g>

  <path d="M750 305 H853" stroke="#8b949e" stroke-width="5" stroke-linecap="round"/>
  <path d="M838 289 L859 305 L838 321" fill="none" stroke="#8b949e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(878 245)">
    <rect width="250" height="120" rx="18" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="125" y="52" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="24" font-weight="600">Vector search</text>
    <text x="125" y="84" text-anchor="middle" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="18">single index</text>
  </g>

  <g transform="translate(520 458)">
    <circle cx="80" cy="80" r="72" fill="#238636"/>
    <polygon points="65,45 65,115 120,80" fill="#ffffff"/>
  </g>

  <text x="600" y="628" text-anchor="middle" fill="#58a6ff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="28" font-weight="700">Click to open the prototype demo</text>
</svg>
