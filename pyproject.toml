[project]
name = "safesearch"
version = "0.1.0"
description = "Enabling medical professionals to make web-search, LLM-requests without leaking PHI."
authors = [
    {name = "James Charl Weatherhead", email = "jamescharlweatherhead@gmail.com"},
    {name = "Jake Craig Weatherhead", email = "jakecraigweatherhead@gmail.com"}
]
license = {text = "Proprietary"}
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.109.2",
    "uvicorn>=0.21.1",
    "pydantic[email]>=1.10.6",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=0.19.0",
    "fastapi-users>=10.4.1",
    "fastapi-users-tortoise>=0.2.0",
    "tortoise-orm[asyncpg]>=0.19.3",
    "aerich>=0.7.1",
    "saq[hiredis,web]>=0.9.3",
    "hupper>=1.11",
    "aiosmtplib>=1.1.6",
    "python-multipart>=0.0.9",
    "sentry-sdk>=1.17.0",
    "loguru>=0.7.0",
    "typer>=0.7.0",
    "Jinja2>=3.1.2",
    "httpx>=0.23.3",
    "openai>=1.14.0",
    "psycopg2-binary>=2.9.5",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "tqdm>=4.65.0",
    "requests>=2.28.0",
    "scalar-fastapi>=0.2.0",
    "honcho>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.2.2",
    "factory-boy>=3.2.1",
    "pre-commit>=3.1.1",
    "mypy>=1.1.1",
    "isort>=5.12.0",
    "ipython>=8.11.0",
    "aiosmtpd>=1.4.4.post2",
]

[tool.aerich]
tortoise_orm = "app.db.config.TORTOISE_ORM"
location = "./migrations"
src_folder = "./."
[tool.isort]
profile = "black"

[tool.mypy]
warn_unreachable = true
pretty = true
show_column_numbers = true
show_error_codes = true
show_error_context = true
ignore_missing_imports = true

[tool.ruff]
line-length = 120
select = [
    "E", # https://github.com/charliermarsh/ruff#pycodestylet
    "F", # https://github.com/charliermarsh/ruff#pyflakes
    "UP", # https://github.com/charliermarsh/ruff#pyupgrade
    "N", # https://github.com/charliermarsh/ruff#pep8-naming
    "S", # https://github.com/charliermarsh/ruff#flake8-bandit
    "C", # https://github.com/charliermarsh/ruff#flake8-comprehensions
    "B", # https://github.com/charliermarsh/ruff#flake8-bugbear
    "T" # https://github.com/charliermarsh/ruff#flake8-print
]

[tool.ruff.lint]
# Enable automatic fixing of unused imports and variables
fixable = ["F401", "F841"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
